<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的课表</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-wrap">
      <span class="app-title">📅 我的课表</span>
      <input id="termInput" class="term-input" placeholder="如：2026 秋季学期" />
    </div>
    <div class="actions">
      <button id="btnSettings" title="设置">⚙ 设置</button>
      <button id="btnExport" title="导出JSON">⬇ 导出</button>
      <button id="btnImport" title="导入JSON">⬆ 导入JSON</button>
      <button id="btnImportPdf" title="导入PDF（图片/文字均可）">⬆ 导入PDF</button>
      <button id="btnClear" class="danger" title="清空课程">🗑 清空</button>
      <input type="file" id="fileInput" accept="application/json" hidden />
      <input type="file" id="pdfInput" accept="application/pdf" hidden />
    </div>
  </header>

  <!-- 周次导航栏 -->
  <div class="weekbar">
    <button id="prevWeek" class="wk-btn" title="上一周">‹</button>
    <div class="wk-center">
      <div id="weekLabel" class="wk-label">第 1 周</div>
      <div id="weekSub" class="wk-sub">共 20 周</div>
    </div>
    <button id="nextWeek" class="wk-btn" title="下一周">›</button>
  </div>
  <div class="week-hint">提示：点 ‹ › 或拖动课表空白处左右滑动可切换周次；拖动课程到边缘停留可换到相邻周并与之互换。</div>

  <main>
    <table id="grid" class="grid"></table>
  </main>

  <!-- 课程编辑弹窗 -->
  <div id="editor" class="modal hidden">
    <div class="modal-box">
      <h3 id="editorTitle">添加课程</h3>
      <form id="courseForm">
        <label>课程名称<input name="fName" id="fName" required placeholder="如：高等数学" /></label>
        <label>教师<input name="fTeacher" id="fTeacher" placeholder="如：张老师" /></label>
        <label>地点<input name="fLocation" id="fLocation" placeholder="如：教三-301" /></label>
        <label>星期
          <select name="fDay" id="fDay">
            <option value="1">周一</option>
            <option value="2">周二</option>
            <option value="3">周三</option>
            <option value="4">周四</option>
            <option value="5">周五</option>
            <option value="6">周六</option>
            <option value="7">周日</option>
          </select>
        </label>
        <div class="row2">
          <label>开始节次<input name="fStart" id="fStart" type="number" min="1" value="1" /></label>
          <label>结束节次<input name="fEnd" id="fEnd" type="number" min="1" value="2" /></label>
        </div>
        <label>周次（这门课在哪些周上）
          <div class="week-picker" id="weekPicker">
            <div class="wp-quick">
              <button type="button" class="wp-chip" data-w="all">每周</button>
              <button type="button" class="wp-chip" data-w="odd">单周</button>
              <button type="button" class="wp-chip" data-w="even">双周</button>
            </div>
            <div class="wp-grid" id="wpGrid"></div>
            <input type="hidden" name="fWeeks" id="fWeeks" value="all" />
          </div>
        </label>
        <label>自定义周次（留空则用上方选择；支持 5-8 / 1,3,5 / all）
          <input name="fWeeksCustom" id="fWeeksCustom" placeholder="如 5-8 或 1,3,5" />
        </label>
        <label>颜色<input name="fColor" id="fColor" type="color" value="#4f86f7" /></label>
        <label>备注<textarea name="fNote" id="fNote" rows="2"></textarea></label>
        <div class="modal-actions">
          <button type="button" id="btnDelete" class="danger hidden">删除</button>
          <span class="spacer"></span>
          <button type="button" id="btnCancel">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings" class="modal hidden">
    <div class="modal-box">
      <h3>课表设置</h3>
      <form id="settingsForm">
        <label>课表粒度（每格代表）
          <select name="sMode" id="sMode">
            <option value="big">大节（每格一大节，默认 4 格）</option>
            <option value="small">小节（每格一节课，默认 8 格）</option>
          </select>
        </label>
        <label>每天节次数（1-20）<input name="sSections" id="sSections" type="number" min="1" max="20" value="12" /></label>
        <label>星期数（5 或 7）<input name="sDays" id="sDays" type="number" min="5" max="7" value="7" /></label>
        <label>总周数（如 20）<input name="sTotalWeeks" id="sTotalWeeks" type="number" min="1" max="40" value="20" /></label>
        <label>开学日期（第1周周一，用于表头显示日期，可留空）<input name="sSemStart" id="sSemStart" type="date" /></label>
        <label>每节时间表（一行一节，如 08:00–09:40，留空用默认）<textarea name="sTimes" id="sTimes" rows="4"></textarea></label>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button type="button" id="sCancel">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="hint">点击空格子添加课程，点击课程块可编辑/删除；按住课程块拖到别的格子即可换课/调休。⚙ 设置里可切换「大节 / 小节」粒度、改节次数、总周数与开学日期。支持导入 PDF（图片/文字均可）与 JSON，数据自动保存在本浏览器。</footer>

  <!-- PDF 导入核对弹窗 -->
  <div id="pdfModal" class="modal hidden">
    <div class="modal-box wide">
      <h3>PDF 导入预览（请核对后确认）</h3>
      <div id="pdfStatus" class="pdf-status">准备中…</div>
      <div class="pdf-table-wrap">
        <table id="pdfTable" class="pdf-table"></table>
      </div>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" id="pdfCancel" class="danger">取消</button>
        <button type="button" id="pdfConfirm" class="primary" disabled>确认导入</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
